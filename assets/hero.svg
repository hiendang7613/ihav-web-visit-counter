<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
  <title id="title">Website traffic, with context</title>
  <desc id="desc">A prompt to check example.com beside a synthetic monthly estimate card with analysis date, two illustrative history snapshots and source.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1023"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#030712" flood-opacity=".35"/>
    </filter>
    <clipPath id="heroCanvasClip" clipPathUnits="userSpaceOnUse">
      <rect width="1280" height="500" rx="34"/>
    </clipPath>
    <clipPath id="snapshotCardClip" clipPathUnits="userSpaceOnUse">
      <rect width="580" height="380" rx="25"/>
    </clipPath>
  </defs>
  <rect width="1280" height="500" rx="34" fill="url(#bg)"/>
  <g clip-path="url(#heroCanvasClip)">
    <circle cx="150" cy="50" r="220" fill="#4f46e5" opacity=".10"/>
    <circle cx="1160" cy="460" r="270" fill="#f59e0b" opacity=".08"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <g transform="translate(76 82)">
      <rect width="62" height="62" rx="17" fill="#1e293b" stroke="#475569"/>
      <circle cx="27" cy="26" r="16" fill="none" stroke="#818cf8" stroke-width="5"/>
      <path d="m39 39 14 14" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
      <path d="M20 32v-8m8 8V17m8 15V12" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
      <text x="82" y="24" fill="#c7d2fe" font-size="15" font-weight="700" letter-spacing="2">IHAV · OPEN SOURCE</text>
      <text x="82" y="58" fill="#fff" font-size="27" font-weight="750">ihav-web-visit-counter</text>
    </g>
    <text x="80" y="235" fill="#fff" font-size="42" font-weight="750">How much traffic</text>
    <text x="80" y="286" fill="#fff" font-size="42" font-weight="750">does that site get?</text>
    <text x="82" y="333" fill="#cbd5e1" font-size="20">Ask Claude Code or Codex.</text>
    <text x="82" y="365" fill="#cbd5e1" font-size="20">Get the estimate, the analysis date</text>
    <text x="82" y="397" fill="#cbd5e1" font-size="20">and the source. No number by guess.</text>
    <rect x="80" y="430" width="290" height="34" rx="17" fill="#312e81"/>
    <text x="99" y="453" fill="#e0e7ff" font-size="14" font-weight="650">SYNTHETIC DEMO · NO LIVE DATA</text>

    <g transform="translate(620 60)" filter="url(#shadow)">
      <g clip-path="url(#snapshotCardClip)">
        <rect width="580" height="380" rx="25" fill="#fff"/>
        <rect width="580" height="57" rx="25" fill="#f8fafc"/>
        <path d="M0 57h580" stroke="#e2e8f0"/>
        <circle cx="27" cy="29" r="5" fill="#f87171"/><circle cx="45" cy="29" r="5" fill="#fbbf24"/><circle cx="63" cy="29" r="5" fill="#34d399"/>
        <text x="91" y="35" fill="#64748b" font-size="14" font-weight="600">TRAFFIC SNAPSHOT · SYNTHETIC</text>
        <text x="35" y="106" fill="#0f172a" font-size="25" font-weight="700">example.com</text>
        <text x="35" y="154" fill="#4f46e5" font-size="36" font-weight="760">~2.43M</text>
        <text x="179" y="153" fill="#334155" font-size="17" font-weight="600">estimated monthly visits</text>
        <text x="35" y="184" fill="#64748b" font-size="14">Analyzed 2026-09-11 · error range not measured</text>
        <rect x="35" y="211" width="510" height="94" rx="13" fill="#f8fafc"/>
        <text x="53" y="236" fill="#64748b" font-size="12" font-weight="700" letter-spacing="1">HISTORY SNAPSHOTS · ILLUSTRATIVE ONLY</text>
        <path d="M55 270 525 253" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="55" y="292" fill="#64748b" font-size="11">2026-08-13</text>
        <text x="525" y="292" fill="#64748b" font-size="11" text-anchor="end">2026-09-11</text>
        <text x="35" y="337" fill="#0f172a" font-size="14" font-weight="650">Top countries</text>
        <text x="146" y="337" fill="#475569" font-size="14">US 41% · IN 9% · GB 6%</text>
        <text x="35" y="359" fill="#4f46e5" font-size="12" font-weight="600">Source link shown with every estimate</text>
      </g>
    </g>
  </g>
</svg>
