<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 410" role="img" aria-labelledby="title desc">
  <title id="title">Synthetic terminal demo</title>
  <desc id="desc">A looping synthetic command and terminal card. The full result remains readable when animation is disabled. These invented figures are not live traffic data.</desc>
  <style>
    .command { animation: typeCommand 12s steps(34, end) infinite; }
    .row { animation: reveal 12s linear infinite; }
    .r1 { animation-name: reveal1; }
    .r2 { animation-name: reveal2; }
    .r3 { animation-name: reveal3; }
    .r4 { animation-name: reveal4; }
    .r5 { animation-name: reveal5; }
    .r6 { animation-name: reveal6; }
    .command, .row { animation-delay: -7s; }
    @keyframes typeCommand { 0% { clip-path: inset(0 100% 0 0) fill-box; } 22%, 95% { clip-path: inset(0 0 0 0) fill-box; } 100% { clip-path: inset(0 100% 0 0) fill-box; } }
    @keyframes reveal1 { 0%, 25%, 100% { opacity: 0; } 26%, 95% { opacity: 1; } }
    @keyframes reveal2 { 0%, 31%, 100% { opacity: 0; } 32%, 95% { opacity: 1; } }
    @keyframes reveal3 { 0%, 37%, 100% { opacity: 0; } 38%, 95% { opacity: 1; } }
    @keyframes reveal4 { 0%, 43%, 100% { opacity: 0; } 44%, 95% { opacity: 1; } }
    @keyframes reveal5 { 0%, 49%, 100% { opacity: 0; } 50%, 95% { opacity: 1; } }
    @keyframes reveal6 { 0%, 55%, 100% { opacity: 0; } 56%, 95% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .command, .row { animation: none; } }
  </style>
  <rect width="1040" height="410" rx="24" fill="#0f172a"/>
  <path d="M0 65h1040" stroke="#334155"/>
  <circle cx="31" cy="33" r="6" fill="#f87171"/><circle cx="52" cy="33" r="6" fill="#fbbf24"/><circle cx="73" cy="33" r="6" fill="#34d399"/>
  <text class="command" x="103" y="39" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">/ihav-web-visit-counter example.com</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">
    <text x="42" y="113" fill="#c4b5fd" font-weight="700">SYNTHETIC EXAMPLE · NOT A LIVE RESULT</text>
    <text class="row r1" x="42" y="157" fill="#f8fafc" font-size="24" font-weight="700">example.com</text>
    <text class="row r2" x="42" y="202" fill="#a5b4fc" font-size="22">~2,430,000 estimated monthly visits · analyzed 2026-09-11</text>
    <text class="row r3" x="42" y="240" fill="#cbd5e1">Error range: not independently measured</text>
    <text class="row r4" x="42" y="278" fill="#cbd5e1">History snapshots 2026-08-13 → 2026-09-11  ▁█</text>
    <text class="row r5" x="42" y="316" fill="#cbd5e1">Top countries: US 41.0% · IN 9.0% · GB 6.0%</text>
    <text class="row r6" x="42" y="354" fill="#fbbf24">Source: WebTrafficChecker · https://webtrafficchecker.com/traffic/example.com</text>
  </g>
</svg>
