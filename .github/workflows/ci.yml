name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.11', '3.13']
        exclude:
          # setup-python does not support Python <3.11 on macOS arm64.
          - os: macos-latest
            python: '3.9'
        include:
          # Keep Python 3.9 coverage on the last supported Intel macOS image.
          - os: macos-15-intel
            python: '3.9'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run fixture-only tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test the CLI help with the selected Python
        run: python plugins/ihav-web-visit-counter/core/ihav-web-visit-counter/scripts/visits.py --help
      - name: Smoke test fixture lookup through the Windows output pipe
        if: runner.os == 'Windows'
        run: python tests/fixture_cli_smoke.py

  consumer-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check out released Leaderboards 0.2.2
        uses: actions/checkout@v7
        with:
          repository: hiendang7613/ihav-leaderboards
          ref: 66524f54288133421f68c5c1d0616ff8f9ffd76c
          path: .consumer-checkouts/leaderboards
          persist-credentials: false
      - name: Check out released Competitor Search 0.1.0
        uses: actions/checkout@v7
        with:
          repository: hiendang7613/ihav-competitor-search
          ref: ec3f44da23c642f638d66ec75195d2d1e704da72
          path: .consumer-checkouts/competitor
          persist-credentials: false
      - name: Check actual consumer code with fixture-only Counter responses
        run: >-
          python tests/consumer_compatibility.py
          --leaderboards-plugin .consumer-checkouts/leaderboards/plugins/ihav-leaderboards
          --competitor-plugin .consumer-checkouts/competitor/plugins/ihav-competitor-search
